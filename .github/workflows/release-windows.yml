name: Release Windows portable app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.1.0
        required: true
        type: string
      ref:
        description: Branch, commit, or existing tag to build
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: prod

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build portable executable
        shell: pwsh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXT_PUBLIC_SUPABASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY)) {
            throw "Configure NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY in the prod environment before releasing."
          }
          npm run package:win

      - name: Locate portable executable
        id: portable
        shell: pwsh
        run: |
          $artifact = Get-ChildItem release -Filter "Library-*-portable.exe" -File
          if ($artifact.Count -ne 1) {
            throw "Expected exactly one portable executable, found $($artifact.Count)."
          }
          "path=$($artifact.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($artifact.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.portable.outputs.name }}
          path: ${{ steps.portable.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $env:MANUAL_TAG
          } else {
            $env:GITHUB_REF_NAME
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "${{ steps.portable.outputs.path }}" `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          } else {
            gh release create $tag "${{ steps.portable.outputs.path }}" `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Library $tag" `
              --generate-notes
          }
