name: Release Playmart for Windows, Linux and macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.1.0
        required: true
        type: string
      ref:
        description: Branch, commit, or existing tag to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set version from release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/release-metadata.cjs
      - name: Resolve checked-out commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            builder: --win portable nsis --x64
          - platform: linux-x64
            os: ubuntu-24.04
            builder: --linux AppImage deb --x64
          - platform: macos-arm64
            os: macos-15
            builder: --mac dmg zip --arm64
          - platform: macos-x64
            os: macos-15-intel
            builder: --mac dmg zip --x64
    runs-on: ${{ matrix.os }}
    environment: prod
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out pinned release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate prod public configuration
        run: node scripts/release-ci.cjs validate-env
      - name: Set version from release tag
        run: node scripts/release-metadata.cjs
      - name: Install dependencies
        run: npm ci
      - name: Prepare and execute native archive extractor
        run: node scripts/release-ci.cjs prepare-extractor
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Package native installers and updater metadata without publishing
        env:
          BUILDER_ARGS: ${{ matrix.builder }}
          # Optional prod secrets: unsigned downloads remain available without them.
          # macOS electron-updater installation requires a Developer ID signed app.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: node scripts/release-ci.cjs package $BUILDER_ARGS -c.generateUpdatesFilesForAllChannels=true
      - name: Verify packaged native archive extractor permissions and execution
        run: node scripts/release-ci.cjs verify-extractor release
      - name: Upload installers and updater files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml
            !release/builder-effective-config.yaml

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Check out pinned release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install CI helper dependencies without native rebuilds
        run: npm ci --ignore-scripts
      - name: Download all native build outputs
        uses: actions/download-artifact@v4
        with:
          path: release-input
          pattern: '*-x64'
      - name: Download macOS arm64 output
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release-input/macos-arm64
      - name: Verify release completeness and merge macOS updater metadata
        run: node scripts/release-ci.cjs stage release-input release-assets
      - name: Upload all assets, then publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci.cjs publish release-assets
